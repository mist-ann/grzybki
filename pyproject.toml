[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grzybki"
version = "0.1.0"
description = "Fungal Growth Optimizer for Polish railway network design"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "grzybki contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "click>=8.0",
    "imageio>=2.31",
]

[project.optional-dependencies]
geo = ["pyproj>=3.5"]
dev = ["pytest>=7.0"]

[project.scripts]
grzybki = "grzybki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grzybki = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
